name: Build and deploy site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build main site
        run: |
          pip install -r main-site/requirements.txt
          mkdocs build -f main-site/mkdocs.yml -d ../public --clean

      - name: Build python course
        run: |
          pip install -r python-course/requirements.txt
          mkdocs build -f python-course/mkdocs.yml -d ../public/python --clean

      - name: Add CNAME
        run: echo "www.hramian.com" > public/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
